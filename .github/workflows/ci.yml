name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform-validation:
    name: Terraform Validation & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -diff eks-nlb-acm-route53-demo/bootstrap
          terraform fmt -check -diff eks-nlb-acm-route53-demo/infra

      - name: Validate Bootstrap Module
        run: |
          cd eks-nlb-acm-route53-demo/bootstrap
          terraform init -backend=false
          terraform validate

      - name: Validate Infrastructure Module
        run: |
          cd eks-nlb-acm-route53-demo/infra
          terraform init -backend=false
          terraform validate

  python-quality:
    name: Application Syntax & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python Bytecode Compilation Check
        run: |
          python -m py_compile eks-nlb-acm-route53-demo/app/app.py

      - name: Lint with Flake8
        run: |
          flake8 eks-nlb-acm-route53-demo/app --count --max-line-length=120 --statistics

  docker-build-test:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: eks-nlb-acm-route53-demo/app
          push: false
          tags: demo-app:ci-test

  scripts-syntax:
    name: Shell Scripts Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking syntax for $script..."
            bash -n "$script"
          done
